<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="img/png" href="img/logo.png">
    <title>Catálogo A&D - Ventas y Suministros A&D</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <img src="img/logo.png" alt="Logo Ventas y Suministros A&D" class="logo">
            <h1>Catálogo</h1>
        </div>
    </header>

    <nav class="filtros-nav" aria-label="Filtros de productos">
        <div class="container">
            <div class="filtros">
                <div class="campo-filtro campo-busqueda">
                    <span class="campo-icono" aria-hidden="true">🔎</span>
                    <input type="text" id="busqueda" placeholder="Buscar productos..." aria-label="Buscar productos">
                </div>

                <div class="campo-filtro">
                    <span class="campo-icono" aria-hidden="true">📂</span>
                    <select id="categoria" class="select-limpio" aria-label="Filtrar por categoría">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <div id="productos" class="grid-productos" role="region" aria-live="polite" aria-label="Listado de productos"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ventas y Suministros A&D. Todos los derechos reservados.</p>
    </footer>

    <script src="productos.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
